plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hunik.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hunik.launcher'
        minSdk 19
        targetSdk 34
        versionCode 20101      // 2.1.1 -> major*10000 + minor*100 + patch
        versionName '2.1.1'
    }

    // Fixed key (instead of a new random debug key on every GitHub run),
    // so a new APK installs over the old one without uninstalling.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
